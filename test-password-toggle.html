<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Password Toggle</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            max-width: 500px;
            margin: 0 auto;
        }
        
        .password-input-group {
            position: relative;
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .password-input-group input {
            width: 100%;
            padding: 12px 45px 12px 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
        }
        
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #6b7280;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
            z-index: 10;
        }
        
        .toggle-password:hover {
            color: #f77c00;
        }
        
        .toggle-password i {
            font-size: 1.1rem;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <h1>Test zobrazení hesla</h1>
    
    <div class="password-input-group">
        <input type="password" id="testPassword" placeholder="Zadejte heslo">
        <button type="button" class="toggle-password" aria-label="Zobrazit heslo">
            <i class="fas fa-eye"></i>
        </button>
    </div>
    
    <div class="password-input-group">
        <input type="password" id="testPassword2" placeholder="Potvrzení hesla">
        <button type="button" class="toggle-password" aria-label="Zobrazit heslo">
            <i class="fas fa-eye"></i>
        </button>
    </div>
    
    <script>
        function setupPasswordToggle() {
            const toggleButtons = document.querySelectorAll('.toggle-password');
            console.log('🔐 Nastavuji toggle hesla, nalezeno tlačítek:', toggleButtons.length);
            
            toggleButtons.forEach((button, index) => {
                button.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    console.log('👁️ Kliknuto na tlačítko zobrazení hesla');
                    
                    const passwordGroup = this.closest('.password-input-group');
                    if (!passwordGroup) {
                        console.warn('⚠️ Nenalezen .password-input-group');
                        return;
                    }
                    
                    const passwordInput = passwordGroup.querySelector('input');
                    const icon = this.querySelector('i');
                    
                    if (!passwordInput || !icon) {
                        console.warn('⚠️ Nenalezen input nebo ikona');
                        return;
                    }
                    
                    if (passwordInput.type === 'password') {
                        passwordInput.type = 'text';
                        icon.classList.remove('fa-eye');
                        icon.classList.add('fa-eye-slash');
                        this.setAttribute('aria-label', 'Skrýt heslo');
                        console.log('✅ Heslo zobrazeno');
                    } else {
                        passwordInput.type = 'password';
                        icon.classList.remove('fa-eye-slash');
                        icon.classList.add('fa-eye');
                        this.setAttribute('aria-label', 'Zobrazit heslo');
                        console.log('✅ Heslo skryto');
                    }
                });
            });
        }
        
        // Inicializovat při načtení stránky
        document.addEventListener('DOMContentLoaded', setupPasswordToggle);
    </script>
</body>
</html>
