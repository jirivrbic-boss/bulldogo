    <!-- Add Service Modal -->
    <div id="addServiceModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Přidat službu</h2>
                <span class="close" onclick="closeAddServiceModal()">&times;</span>
            </div>
            <form id="addServiceForm" class="service-form">
                <div class="form-group">
                    <input type="text" id="serviceTitle" name="title" placeholder="Název služby" required>
                </div>
                <div class="form-group">
                    <select id="serviceCategory" name="category" required>
                        <option value="">Vyberte kategorii</option>
                        <option value="home_craftsmen">Domácnost & Řemeslníci</option>
                        <option value="auto_moto">Auto & Moto</option>
                        <option value="garden_exterior">Zahrada & Exteriér</option>
                        <option value="education_tutoring">Vzdělávání & Doučování</option>
                        <option value="it_technology">IT & technologie</option>
                        <option value="health_personal_care">Zdraví a Osobní péče</option>
                        <option value="gastronomy_catering">Gastronomie & Catering</option>
                        <option value="events_entertainment">Události & Zábava</option>
                        <option value="personal_small_jobs">Osobní služby & drobné práce</option>
                        <option value="auto_moto_transport">Auto - moto doprava</option>
                        <option value="hobby_creative">Hobby & kreativní služby</option>
                        <option value="law_finance_admin">Právo & finance & administrativa</option>
                        <option value="pets">Domácí zvířata</option>
                        <option value="specialized_custom">Specializované služby na přání</option>
                    </select>
                </div>
                <div class="form-group">
                    <textarea id="serviceDescription" name="description" placeholder="Popis služby" rows="4" maxlength="600" required></textarea>
                    <div class="char-counter">
                        <span id="serviceDescriptionCounter">600</span> znaků zbývá
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Cena</label>
                    <div class="price-options">
                        <label class="price-option">
                            <input type="radio" name="priceType" value="fixed" onchange="togglePriceInputs()">
                            <span class="option-text">Fixní cena</span>
                        </label>
                        <label class="price-option">
                            <input type="radio" name="priceType" value="range" onchange="togglePriceInputs()">
                            <span class="option-text">Rozmezí</span>
                        </label>
                        <label class="price-option">
                            <input type="radio" name="priceType" value="negotiable" onchange="togglePriceInputs()">
                            <span class="option-text">Dohodou</span>
                        </label>
                    </div>
                    <div id="priceInputs" class="price-inputs" style="display: none;">
                        <div class="price-input-group">
                            <input type="number" id="priceFrom" name="priceFrom" placeholder="Od (Kč)" min="0">
                            <input type="number" id="priceTo" name="priceTo" placeholder="Do (Kč)" min="0">
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Lokace</label>
                    <input type="text" id="serviceLocation" name="location" placeholder="Město nebo oblast" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Kontakt</label>
                    <input type="email" id="serviceContact" name="contact" placeholder="Email pro kontakt" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Obrázky (volitelné)</label>
                    <input type="file" id="serviceImages" name="images" multiple accept="image/*" onchange="setupImagePreviews()">
                    <div id="imagePreviews" class="image-previews"></div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeAddServiceModal()">Zrušit</button>
                    <button type="submit" class="btn btn-primary">Přidat službu</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Initialize auth state for profile page
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 Profile page loaded');
            // Immediately show empty state
            showEmptyProfile();
            loadUserProfile();
            
            // Zkusit načíst recenze i po chvíli, pokud se nenačtou automaticky
            setTimeout(() => {
                const currentUser = window.firebaseAuth?.currentUser;
                const container = document.getElementById('allReviewsContainer');
                if (currentUser && container) {
                    const loadingText = container.querySelector('.loading-reviews');
                    if (loadingText) {
                        console.log('🔄 Zkouším načíst recenze po timeoutu...');
                        loadAllUserReviews(currentUser.uid).catch(e => {
                            console.error('❌ Error loading reviews after timeout:', e);
                        });
                    }
                }
            }, 2000);
        });

        // Show empty profile state
        function showEmptyProfile() {
            console.log('🔄 Showing empty profile state');
            
            // Update profile header with empty values
            const profileName = document.querySelector('.profile-name');
            if (profileName) {
                profileName.textContent = 'Uživatel';
                console.log('📝 Updated name to: Uživatel');
            }

            const profileRole = document.querySelector('.profile-role');
            if (profileRole) {
                profileRole.textContent = 'Poskytovatel služeb';
                console.log('📝 Updated role to: Poskytovatel služeb');
            }

            const profileLocation = document.querySelector('.profile-location span');
            if (profileLocation) {
                profileLocation.textContent = 'Lokace není uvedena';
                console.log('📝 Updated location to: Lokace není uvedena');
            }

            // Update statistics with empty values
            const statNumbers = document.querySelectorAll('.stat-number');
            statNumbers.forEach((stat, index) => {
                stat.textContent = '-';
                console.log(`📝 Updated stat ${index + 1} to: -`);
            });

            console.log('✅ Empty profile state shown');
        }

        // Test function to verify JavaScript is working
        function testProfile() {
            console.log('🧪 Test function called');
            alert('JavaScript funguje!');
        }

        // Load user profile data
        async function loadUserProfile() {
            console.log('🔧🔧🔧 loadUserProfile VOLÁNO 🔧🔧🔧');
            try {
                // Wait for Firebase to be available
                let checkCount = 0;
                const checkFirebase = setInterval(() => {
                    checkCount++;
                    console.log('🔍 Checking Firebase (pokus ' + checkCount + '):', {
                        firebaseAuth: !!window.firebaseAuth,
                        firebaseDb: !!window.firebaseDb
                    });
                    if (window.firebaseAuth && window.firebaseDb) {
                        console.log('✅ Firebase available, checking auth');
                        clearInterval(checkFirebase);
                        
                        // Check if user is logged in
                        const currentUser = window.firebaseAuth.currentUser;
                        if (!currentUser) {
                            // User is not logged in - redirect to login
                            console.log('⚠️ Uživatel není přihlášen - přesměrování na přihlášení');
                            if (typeof showAuthModal === 'function') {
                                showAuthModal('login');
                            } else {
                                window.location.href = 'index.html';
                            }
                            return;
                        }
                        
                        console.log('✅ Uživatel přihlášen, volám loadUserData a loadAllUserReviews...');
                        // Načíst recenze NEZÁVISLE na loadUserData
                        const currentUserForReviews = window.firebaseAuth.currentUser;
                        if (currentUserForReviews) {
                            console.log('📚 Načítám recenze nezávisle na loadUserData...');
                            loadAllUserReviews(currentUserForReviews.uid).catch(e => {
                                console.error('❌ Error loading reviews:', e);
                            });
                        }
                        
                        // Načíst ostatní data
                        loadUserData().catch(err => {
                            console.error('❌ Error in loadUserData:', err);
                        });
                        
                        // Listen for auth state changes
                        window.firebaseAuth.onAuthStateChanged((user) => {
                            console.log('👤 Auth state changed on profile page:', user ? user.email : 'Not logged in');
                            if (user) {
                                // Načíst recenze NEZÁVISLE na loadUserData
                                console.log('📚 Načítám recenze nezávisle na loadUserData (auth state changed)...');
                                loadAllUserReviews(user.uid).catch(e => {
                                    console.error('❌ Error loading reviews:', e);
                                });
                                
                                // Načíst ostatní data
                                loadUserData().catch(err => {
                                    console.error('❌ Error in loadUserData:', err);
                                });
                            } else {
                                // User logged out - redirect to login
                                console.log('⚠️ Uživatel se odhlásil - přesměrování na přihlášení');
                                if (typeof showAuthModal === 'function') {
                                    showAuthModal('login');
                                } else {
                                    window.location.href = 'index.html';
                                }
                            }
                        });
                    }
                }, 100);
            } catch (error) {
                console.error('❌ Chyba při načítání profilu:', error);
            }
        }

        // Load actual user data
        async function loadUserData() {
            console.log('💾💾💾 loadUserData VOLÁNO 💾💾💾');
            try {
                const currentUser = window.firebaseAuth?.currentUser;
                if (!currentUser) {
                    console.log('⚠️ Uživatel není přihlášen - zobrazuji prázdné údaje');
                    showEmptyProfile();
                    return;
                }

                console.log('👤 Načítám data pro uživatele:', currentUser.uid);
                console.log('👤 Firebase Auth:', !!window.firebaseAuth);
                console.log('👤 Firebase DB:', !!window.firebaseDb);

                // Load user profile from Firestore
                const { getDoc, doc } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
                const profileRef = doc(window.firebaseDb, 'users', currentUser.uid, 'profile', 'profile');
                const profileSnap = await getDoc(profileRef);
                
                let userProfile = null;
                if (profileSnap.exists()) {
                    userProfile = profileSnap.data();
                }

                // Load user ads to get statistics
                const { getDocs, collection } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
                const adsRef = collection(window.firebaseDb, 'users', currentUser.uid, 'inzeraty');
                const adsSnapshot = await getDocs(adsRef);
                
                const userAds = [];
                adsSnapshot.forEach((doc) => {
                    const adData = doc.data();
                    userAds.push({ 
                        id: doc.id, 
                        ...adData,
                        status: adData.status || (adData.active === false ? 'inactive' : 'active')
                    });
                });

                console.log('📦 Loaded user ads:', userAds.length, 'ads:', userAds.map(ad => ({ id: ad.id, status: ad.status, active: ad.active })));

                // Update profile display
                updateProfileDisplay(currentUser, userProfile);
                
                // Update statistics
                console.log('📊 Calling updateStatistics with:', { userAds: userAds.length, userProfile });
                updateStatistics(userAds, userProfile);
                
                // Load all reviews and update rating after loading
                console.log('📚📚📚 VOLÁM loadAllUserReviews pro:', currentUser.uid);
                await loadAllUserReviews(currentUser.uid);
                console.log('📚📚📚 loadAllUserReviews DOKONČENO');

            } catch (error) {
                console.error('❌ Chyba při načítání dat uživatele:', error);
                console.error('Error details:', {
                    code: error.code,
                    message: error.message,
                    stack: error.stack
                });
                
                // Zkusit načíst recenze i při chybě v loadUserData
                try {
                    const currentUser = window.firebaseAuth?.currentUser;
                    if (currentUser) {
                        console.log('🔄 Zkouším načíst recenze i při chybě...');
                        await loadAllUserReviews(currentUser.uid);
                    }
                } catch (reviewError) {
                    console.error('❌ Chyba při načítání recenzí:', reviewError);
                }
            }
        }

        // Update profile display with user data
        function updateProfileDisplay(user, userProfile) {
            console.log('🔄 Updating profile display:', { user, userProfile });
            
            // Hero section now uses static text "Můj profil"
            
            // Update other profile elements if they exist
            const profileName = document.querySelector('.profile-name');
            if (profileName) {
                const displayName = userProfile?.name || user?.displayName || user?.email?.split('@')[0] || 'Uživatel';
                profileName.textContent = displayName;
            }
        }

        // Update profile header with real data
        function updateProfileHeader(user, userProfile) {
            console.log('🔄 Updating profile header:', { user, userProfile });
            
            // Hero section now uses static text "Můj profil"

            // Update role
            const profileRole = document.querySelector('.profile-role');
            if (profileRole) {
                const role = userProfile?.companyName || userProfile?.role || 'Poskytovatel služeb';
                profileRole.textContent = role;
                console.log('📝 Updated role:', role);
            }

            // Update location
            const profileLocation = document.querySelector('.profile-location span');
            if (profileLocation) {
                // Pro firmy použít businessAddress jako lokaci, jinak city nebo location
                let location = 'Lokace není uvedena';
                if (userProfile?.userType === 'company' || userProfile?.type === 'company') {
                    // U firmy použít businessAddress jako lokaci
                    location = userProfile?.businessAddress || userProfile?.location || userProfile?.city || 'Lokace není uvedena';
                } else {
                    // U fyzické osoby použít city nebo location
                    location = userProfile?.city || userProfile?.location || 'Lokace není uvedena';
                }
                profileLocation.textContent = location;
                console.log('📝 Updated location:', location);
            }

            // Update email in profile info
            const profileEmail = document.querySelector('.profile-email');
            if (profileEmail) {
                profileEmail.textContent = user?.email || '';
            }
        }

        // Update statistics with real data
        function updateStatistics(userAds, userProfile) {
            console.log('📊 Updating statistics:', { userAds: userAds?.length, userProfile });
            
            // Active ads count - podpora různých polí stavu
            let activeAds = 0;
            if (userAds && Array.isArray(userAds)) {
                activeAds = userAds.filter(ad => {
                    // Zkontrolovat různé způsoby, jak může být inzerát aktivní
                    if (ad.status === 'active') return true;
                    if (ad.status === 'inactive' || ad.status === 'deleted') return false;
                    // Pokud není status, zkontrolovat další pole
                    if (typeof ad.active === 'boolean') return ad.active === true;
                    if (typeof ad.isActive === 'boolean') return ad.isActive === true;
                    // Pokud není žádný status, považuj za aktivní (pokud není explicitně deaktivován)
                    if (ad.inactiveReason) return false;
                    return true; // Výchozí: považuj za aktivní
                }).length;
            }
            
            const activeAdsElement = document.querySelector('.stat-card:nth-child(1) .stat-number');
            if (activeAdsElement) {
                activeAdsElement.textContent = activeAds > 0 ? String(activeAds) : '-';
                console.log('📝 Updated active ads:', activeAds);
            } else {
                console.warn('⚠️ Active ads element not found');
            }

            // Rating se aktualizuje později v updateRatingFromReviews po načtení reviews
            // Zde jen nastavíme výchozí hodnotu
            const ratingElement = document.querySelector('.stat-card:nth-child(2) .stat-number');
            if (ratingElement && ratingElement.textContent === '-') {
                // Necháme "-" dokud se nenačtou reviews
                console.log('📝 Rating will be updated after reviews are loaded');
            }
            
            console.log('✅ Statistics updated');
        }


        // Helper function to get time ago
        function getTimeAgo(date) {
            const now = new Date();
            const diffMs = now - date;
            const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
            const diffDays = Math.floor(diffHours / 24);

            if (diffDays > 0) {
                return `Před ${diffDays} dny`;
            } else if (diffHours > 0) {
                return `Před ${diffHours} hodinami`;
            } else {
                return 'Před chvílí';
            }
        }

        // Načíst recenze pomocí nového modulu
        async function loadAllUserReviews(userId) {
            console.log('📖 Loading reviews for user:', userId);
            
            const container = document.getElementById('allReviewsContainer');
            if (!container) {
                console.error('❌ Reviews container not found');
                return;
            }
            
            try {
                // Počkat na načtení reviews modulu
                if (!window.ReviewsSystem || !window.fetchReviewsForTarget) {
                    console.log('⏳ Waiting for reviews module...');
                    await new Promise(resolve => {
                        const checkInterval = setInterval(() => {
                            if (window.ReviewsSystem && window.fetchReviewsForTarget) {
                                clearInterval(checkInterval);
                                resolve();
                            }
                        }, 100);
                    });
                }
                
                // Načíst recenze "o mně" (targetUserId == currentUserId)
                const reviewsAboutMe = await window.fetchReviewsForTarget(userId, {
                    orderBy: 'createdAt',
                    orderDirection: 'desc',
                    limit: 5 // Jen 5 nejnovějších pro "Nedávné recenze"
                });
                
                console.log('✅ Loaded reviews about me:', reviewsAboutMe.length);
                
                // Zobrazit recenze
                await window.renderReviews(container, reviewsAboutMe, {
                    showAuthorName: true,
                    showPhotos: true,
                    maxReviews: 5
                });
                
                // Aktualizovat statistiky
                if (reviewsAboutMe.length > 0) {
                    const stats = window.computeRatingsStats(reviewsAboutMe);
                    updateRatingFromStats(stats);
                }
                
            } catch (error) {
                console.error('❌ Error loading reviews:', error);
                container.innerHTML = `
                    <div class="no-reviews">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h4>Chyba při načítání recenzí</h4>
                        <p>${error.message || 'Zkuste obnovit stránku.'}</p>
                    </div>
                `;
            }
        }

        // Update rating in statistics from stats object
        function updateRatingFromStats(stats) {
            console.log('🔄 Updating rating from stats:', stats);
            
            if (!stats || stats.total === 0) {
                return;
            }
            
            const ratingElement = document.querySelector('.stat-card:nth-child(2) .stat-number');
            if (ratingElement) {
                if (validReviews.length > 0) {
                    ratingElement.textContent = avgRating.toFixed(1);
                    console.log('✅ Updated rating from reviews:', avgRating.toFixed(1), 'from', validReviews.length, 'reviews');
                } else {
                    ratingElement.textContent = '-';
                    console.log('📝 No valid reviews found, rating set to "-"');
                }
            } else {
                console.error('❌ Rating element not found!');
            }
        }


        // Tab switching functionality
        function showTab(tabName) {
            console.log('🔄 Switching to tab:', tabName);
            
            // Hide all tab contents
            const allTabs = document.querySelectorAll('.tab-content');
            allTabs.forEach(tab => tab.classList.remove('active'));
            
            // Remove active class from all tab buttons
            const allTabBtns = document.querySelectorAll('.tab-btn');
            allTabBtns.forEach(btn => btn.classList.remove('active'));
            
            // Show selected tab content
            const selectedTab = document.getElementById(tabName + '-tab');
            if (selectedTab) {
                selectedTab.classList.add('active');
            }
            
            // Add active class to relevant tab button (bez závislosti na event)
            const btns = Array.from(document.querySelectorAll('.tab-btn'));
            const currentBtn = btns.find(b => (b.getAttribute('onclick') || '').includes("showTab('" + tabName + "')"));
            if (currentBtn) currentBtn.classList.add('active');
            
            // Load content for the selected tab

        }

    </script>
