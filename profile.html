                <li class="nav-item">

        <!-- Auth Buttons Section (shown when not logged in) -->
        <div class="auth-section" id="authSection">
            <button class="btn-login" onclick="showAuthModal('login')">

            </button>
            <button class="btn-register" onclick="showAuthModal('register')">
                <i class="fas fa-user-plus"></i>
                <span>Registrace</span>
            </button>
        </div>

        <!-- User Profile Section (shown when logged in) -->
        <div class="user-profile-section" id="userProfileSection" style="display: none;">
            <button class="btn-profile" onclick="window.location.href='profile.html'">
                <i class="fas fa-user-circle"></i>
                <span>Profil</span>
            </button>
            <button class="btn-logout" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i>

    <!-- Mobile Menu Button -->
    <button class="mobile-menu-btn" onclick="toggleMobileMenu()">
        <i class="fas fa-bars"></i>
    </button>

    <!-- Sidebar Toggle Button (when collapsed) -->
    <button class="sidebar-toggle-btn" onclick="toggleSidebar()">
        <i class="fas fa-bars"></i>
    </button>

    <!-- Main Content Wrapper -->
    <div class="main-content">
        <!-- Profile Hero Section -->
        <section class="page-hero">
            <div class="container">
                <div class="page-hero-card">
                    <div class="page-hero-inner">
                        <h2 class="services-title" style="display:flex; align-items:center; justify-content:center; gap:12px; width:100%; text-align:center;">
                            <span class="title-text">Můj profil</span>
                            <span class="title-accent"></span>
                            <img id="profileHeroAvatar" alt="Profilová fotka" style="width:40px; height:40px; border-radius:50%; object-fit:cover; display:none; border:1px solid #e5e7eb;" loading="lazy" decoding="async">
                        </h2>
                        <p class="page-hero-subtitle">Váš osobní profil a statistiky</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Tab Navigation -->
        <div class="tab-navigation">
            <button class="tab-btn active" onclick="showTab('overview')">Přehled</button>
            <button class="tab-btn" onclick="window.location.href='profile-ratings.html'">Hodnocení</button>
            <button class="tab-btn" onclick="window.location.href='profile-settings.html'">Nastavení</button>
            <button class="tab-btn" onclick="window.location.href='profile-plan.html'">Spravovat balíček</button>
            <button class="tab-btn" onclick="window.location.href='profile-top.html'">Spravovat topování</button>
        </div>

        <!-- Main Content -->
        <div class="profile-content">
            <!-- Overview Tab Content -->
            <div id="overview-tab" class="tab-content active">
                <div class="content-left">
                    <!-- Reviews Section -->
                    <div class="content-section">
                        <h3 class="section-title">
                            <i class="fas fa-star"></i> Nedávné recenze
                        </h3>
                        <div id="allReviewsContainer" class="reviews-list-container">
                            <div class="loading-reviews">
                                <i class="fas fa-spinner fa-spin"></i>
                                <p>Načítám recenze...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>


            <div class="content-right">

                <!-- Quick Actions -->
                <div class="content-section">
                    <h3 class="section-title">Rychlé akce</h3>
                    <div class="quick-actions">
                        <button class="quick-action-btn" onclick="if(typeof requireAuthForCreateAd === 'function') { requireAuthForCreateAd(); } else { window.location.href='create-ad.html'; }">
                            <i class="fas fa-plus"></i>
                            <span>Nový inzerát</span>
                        </button>
                        <button class="quick-action-btn" onclick="window.location.href='profile-settings.html'">
                            <i class="fas fa-pencil-alt"></i>
                            <span>Upravit profil</span>
                        </button>
                        <button class="quick-action-btn" onclick="window.location.href='top-ads.html'">
                            <i class="fas fa-fire"></i>
                            <span>Topovat</span>
                        </button>
                        <button class="quick-action-btn" onclick="if(typeof checkAuthForChat === 'function') checkAuthForChat(); else if(typeof window.checkAuthForChat === 'function') window.checkAuthForChat(); else window.location.href='chat.html';">
                            <i class="fas fa-comment-alt"></i>
                            <span>Chat</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Service Modal -->
    <div id="addServiceModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Přidat službu</h2>
                <span class="close" onclick="closeAddServiceModal()">&times;</span>
            </div>
            <form id="addServiceForm" class="service-form">
                <div class="form-group">
                    <input type="text" id="serviceTitle" name="title" placeholder="Název služby" required>
                </div>
                <div class="form-group">
                    <select id="serviceCategory" name="category" required>
                        <option value="">Vyberte kategorii</option>
                        <option value="home_craftsmen">Domácnost & Řemeslníci</option>
                        <option value="auto_moto">Auto & Moto</option>
                        <option value="garden_exterior">Zahrada & Exteriér</option>
                        <option value="education_tutoring">Vzdělávání & Doučování</option>
                        <option value="it_technology">IT & technologie</option>
                        <option value="health_personal_care">Zdraví a Osobní péče</option>
                        <option value="gastronomy_catering">Gastronomie & Catering</option>
                        <option value="events_entertainment">Události & Zábava</option>
                        <option value="personal_small_jobs">Osobní služby & drobné práce</option>
                        <option value="auto_moto_transport">Auto - moto doprava</option>
                        <option value="hobby_creative">Hobby & kreativní služby</option>
                        <option value="law_finance_admin">Právo & finance & administrativa</option>
                        <option value="pets">Domácí zvířata</option>
                        <option value="specialized_custom">Specializované služby na přání</option>
                    </select>
                </div>
                <div class="form-group">
                    <textarea id="serviceDescription" name="description" placeholder="Popis služby" rows="4" maxlength="600" required></textarea>
                    <div class="char-counter">
                        <span id="serviceDescriptionCounter">600</span> znaků zbývá
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Cena</label>
                    <div class="price-options">
                        <label class="price-option">
                            <input type="radio" name="priceType" value="fixed" onchange="togglePriceInputs()">
                            <span class="option-text">Fixní cena</span>
                        </label>
                        <label class="price-option">
                            <input type="radio" name="priceType" value="range" onchange="togglePriceInputs()">
                            <span class="option-text">Rozmezí</span>
                        </label>
                        <label class="price-option">
                            <input type="radio" name="priceType" value="negotiable" onchange="togglePriceInputs()">
                            <span class="option-text">Dohodou</span>
                        </label>
                    </div>
                    <div id="priceInputs" class="price-inputs" style="display: none;">
                        <div class="price-input-group">
                            <input type="number" id="priceFrom" name="priceFrom" placeholder="Od (Kč)" min="0">
                            <input type="number" id="priceTo" name="priceTo" placeholder="Do (Kč)" min="0">
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Lokace</label>
                    <input type="text" id="serviceLocation" name="location" placeholder="Město nebo oblast" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Kontakt</label>
                    <input type="email" id="serviceContact" name="contact" placeholder="Email pro kontakt" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Obrázky (volitelné)</label>
                    <input type="file" id="serviceImages" name="images" multiple accept="image/*" onchange="setupImagePreviews()">
                    <div id="imagePreviews" class="image-previews"></div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeAddServiceModal()">Zrušit</button>
                    <button type="submit" class="btn btn-primary">Přidat službu</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js" defer></script>
    <script src="auth.js" defer></script>
    <script src="cities.js" defer></script>
    <script src="click-spark.js" defer></script>

    </style>
    <script>
        // Initialize auth state for profile page
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 Profile page loaded');
            // Immediately show empty state
            showEmptyProfile();
            loadUserProfile();
        });

        // Show empty profile state
        function showEmptyProfile() {
            console.log('🔄 Showing empty profile state');
            
            // Update profile header with empty values
            const profileName = document.querySelector('.profile-name');
            if (profileName) {
                profileName.textContent = 'Uživatel';
                console.log('📝 Updated name to: Uživatel');
            }

            const profileRole = document.querySelector('.profile-role');
            if (profileRole) {
                profileRole.textContent = 'Poskytovatel služeb';
                console.log('📝 Updated role to: Poskytovatel služeb');
            }

            const profileLocation = document.querySelector('.profile-location span');
            if (profileLocation) {
                profileLocation.textContent = 'Lokace není uvedena';
                console.log('📝 Updated location to: Lokace není uvedena');
            }

            // Update statistics with empty values
            const statNumbers = document.querySelectorAll('.stat-number');
            statNumbers.forEach((stat, index) => {
                stat.textContent = '-';
                console.log(`📝 Updated stat ${index + 1} to: -`);
            });

            console.log('✅ Empty profile state shown');
        }

        // Test function to verify JavaScript is working
        function testProfile() {
            console.log('🧪 Test function called');
            alert('JavaScript funguje!');
        }

        // Load user profile data
        async function loadUserProfile() {
            console.log('🔧 Loading user profile...');
            try {
                // Wait for Firebase to be available
                const checkFirebase = setInterval(() => {
                    console.log('🔍 Checking Firebase:', {
                        firebaseAuth: !!window.firebaseAuth,
                        firebaseDb: !!window.firebaseDb
                    });
                    if (window.firebaseAuth && window.firebaseDb) {
                        console.log('✅ Firebase available, checking auth');
                        clearInterval(checkFirebase);
                        
                        // Check if user is logged in
                        const currentUser = window.firebaseAuth.currentUser;
                        if (!currentUser) {
                            // User is not logged in - redirect to login
                            console.log('⚠️ Uživatel není přihlášen - přesměrování na přihlášení');
                            if (typeof showAuthModal === 'function') {
                                showAuthModal('login');
                            } else {
                                window.location.href = 'index.html';
                            }
                            return;
                        }
                        
                        loadUserData();
                        
                        // Listen for auth state changes
                        window.firebaseAuth.onAuthStateChanged((user) => {
                            console.log('👤 Auth state changed on profile page:', user ? user.email : 'Not logged in');
                            if (user) {
                                loadUserData();
                            } else {
                                // User logged out - redirect to login
                                console.log('⚠️ Uživatel se odhlásil - přesměrování na přihlášení');
                                if (typeof showAuthModal === 'function') {
                                    showAuthModal('login');
                                } else {
                                    window.location.href = 'index.html';
                                }
                            }
                        });
                    }
                }, 100);
            } catch (error) {
                console.error('❌ Chyba při načítání profilu:', error);
            }
        }

        // Load actual user data
        async function loadUserData() {
            console.log('💾 Loading user data...');
            try {
                const currentUser = window.firebaseAuth.currentUser;
                if (!currentUser) {
                    console.log('⚠️ Uživatel není přihlášen - zobrazuji prázdné údaje');
                    showEmptyProfile();
                    return;
                }

                console.log('👤 Načítám data pro uživatele:', currentUser.uid);

                // Load user profile from Firestore
                const { getDoc, doc } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
                const profileRef = doc(window.firebaseDb, 'users', currentUser.uid, 'profile', 'profile');
                const profileSnap = await getDoc(profileRef);
                
                let userProfile = null;
                if (profileSnap.exists()) {
                    userProfile = profileSnap.data();
                }

                // Load user ads to get statistics
                const { getDocs, collection } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
                const adsRef = collection(window.firebaseDb, 'users', currentUser.uid, 'inzeraty');
                const adsSnapshot = await getDocs(adsRef);
                
                const userAds = [];
                adsSnapshot.forEach((doc) => {
                    const adData = doc.data();
                    userAds.push({ 
                        id: doc.id, 
                        ...adData,
                        status: adData.status || (adData.active === false ? 'inactive' : 'active')
                    });
                });

                console.log('📦 Loaded user ads:', userAds.length, 'ads:', userAds.map(ad => ({ id: ad.id, status: ad.status, active: ad.active })));

                // Update profile display
                updateProfileDisplay(currentUser, userProfile);
                
                // Update statistics
                console.log('📊 Calling updateStatistics with:', { userAds: userAds.length, userProfile });
                updateStatistics(userAds, userProfile);
                
                // Load all reviews and update rating after loading
                await loadAllUserReviews(currentUser.uid);

            } catch (error) {
                console.error('Chyba při načítání dat uživatele:', error);
            }
        }

        // Update profile display with user data
        function updateProfileDisplay(user, userProfile) {
            console.log('🔄 Updating profile display:', { user, userProfile });
            
            // Hero section now uses static text "Můj profil"
            
            // Update other profile elements if they exist
            const profileName = document.querySelector('.profile-name');
            if (profileName) {
                const displayName = userProfile?.name || user?.displayName || user?.email?.split('@')[0] || 'Uživatel';
                profileName.textContent = displayName;
            }
        }

        // Update profile header with real data
        function updateProfileHeader(user, userProfile) {
            console.log('🔄 Updating profile header:', { user, userProfile });
            
            // Hero section now uses static text "Můj profil"

            // Update role
            const profileRole = document.querySelector('.profile-role');
            if (profileRole) {
                const role = userProfile?.companyName || userProfile?.role || 'Poskytovatel služeb';
                profileRole.textContent = role;
                console.log('📝 Updated role:', role);
            }

            // Update location
            const profileLocation = document.querySelector('.profile-location span');
            if (profileLocation) {
                // Pro firmy použít businessAddress jako lokaci, jinak city nebo location
                let location = 'Lokace není uvedena';
                if (userProfile?.userType === 'company' || userProfile?.type === 'company') {
                    // U firmy použít businessAddress jako lokaci
                    location = userProfile?.businessAddress || userProfile?.location || userProfile?.city || 'Lokace není uvedena';
                } else {
                    // U fyzické osoby použít city nebo location
                    location = userProfile?.city || userProfile?.location || 'Lokace není uvedena';
                }
                profileLocation.textContent = location;
                console.log('📝 Updated location:', location);
            }

            // Update email in profile info
            const profileEmail = document.querySelector('.profile-email');
            if (profileEmail) {
                profileEmail.textContent = user?.email || '';
            }
        }

        // Update statistics with real data
        function updateStatistics(userAds, userProfile) {
            console.log('📊 Updating statistics:', { userAds: userAds?.length, userProfile });
            
            // Active ads count - podpora různých polí stavu
            let activeAds = 0;
            if (userAds && Array.isArray(userAds)) {
                activeAds = userAds.filter(ad => {
                    // Zkontrolovat různé způsoby, jak může být inzerát aktivní
                    if (ad.status === 'active') return true;
                    if (ad.status === 'inactive' || ad.status === 'deleted') return false;
                    // Pokud není status, zkontrolovat další pole
                    if (typeof ad.active === 'boolean') return ad.active === true;
                    if (typeof ad.isActive === 'boolean') return ad.isActive === true;
                    // Pokud není žádný status, považuj za aktivní (pokud není explicitně deaktivován)
                    if (ad.inactiveReason) return false;
                    return true; // Výchozí: považuj za aktivní
                }).length;
            }
            
            const activeAdsElement = document.querySelector('.stat-card:nth-child(1) .stat-number');
            if (activeAdsElement) {
                activeAdsElement.textContent = activeAds > 0 ? String(activeAds) : '-';
                console.log('📝 Updated active ads:', activeAds);
            } else {
                console.warn('⚠️ Active ads element not found');
            }

            // Rating se aktualizuje později v updateRatingFromReviews po načtení reviews
            // Zde jen nastavíme výchozí hodnotu
            const ratingElement = document.querySelector('.stat-card:nth-child(2) .stat-number');
            if (ratingElement && ratingElement.textContent === '-') {
                // Necháme "-" dokud se nenačtou reviews
                console.log('📝 Rating will be updated after reviews are loaded');
            }
            
            console.log('✅ Statistics updated');
        }


        // Helper function to get time ago
        function getTimeAgo(date) {
            const now = new Date();
            const diffMs = now - date;
            const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
            const diffDays = Math.floor(diffHours / 24);

            if (diffDays > 0) {
                return `Před ${diffDays} dny`;
            } else if (diffHours > 0) {
                return `Před ${diffHours} hodinami`;
            } else {
                return 'Před chvílí';
            }
        }

        // Load all user reviews (profile + ads) - zjednodušená verze podle profile-detail.js
        async function loadAllUserReviews(userId) {
            console.log('⭐ Loading all reviews for user:', userId);
            try {
                const container = document.getElementById('allReviewsContainer');
                if (!container) {
                    console.error('❌ allReviewsContainer not found!');
                    return;
                }
                console.log('✅ allReviewsContainer found');

                const { getDocs, collection, collectionGroup, getDoc, doc } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
                
                const allReviews = [];
                
                // Načíst jen recenze na profilu uživatele (users/{userId}/reviews)
                try {
                    const profileReviewsRef = collection(window.firebaseDb, 'users', userId, 'reviews');
                    const profileReviewsSnap = await getDocs(profileReviewsRef);
                    console.log('📖 Načteno recenzí z profilu:', profileReviewsSnap.size);
                    
                    profileReviewsSnap.forEach(doc => {
                        const reviewData = doc.data();
                        reviewData.id = doc.id;
                        reviewData.type = 'profile';
                        allReviews.push(reviewData);
                    });
                } catch (error) {
                    console.error('❌ Error loading profile reviews:', error);
                    console.error('Error details:', {
                        code: error.code,
                        message: error.message,
                        path: `users/${userId}/reviews`
                    });
                    // Pokračovat i při chybě
                }

                console.log('📊 Celkem načteno recenzí:', allReviews.length);
                
                if (allReviews.length > 0) {
                    console.log('📊 První recenze:', {
                        id: allReviews[0].id,
                        rating: allReviews[0].rating,
                        text: allReviews[0].text?.substring(0, 50),
                        createdAt: allReviews[0].createdAt,
                        updatedAt: allReviews[0].updatedAt
                    });
                } else {
                    console.log('⚠️ Žádné recenze nenalezeny pro uživatele:', userId);
                }

                // Sort by date (newest first)
                allReviews.sort((a, b) => {
                    const dateA = a.updatedAt?.toDate?.() || a.updatedAt || 
                                  a.createdAt?.toDate?.() || a.createdAt || 
                                  new Date(0);
                    const dateB = b.updatedAt?.toDate?.() || b.updatedAt || 
                                  b.createdAt?.toDate?.() || b.createdAt || 
                                  new Date(0);
                    return new Date(dateB) - new Date(dateA);
                });

                // Render reviews - načíst jména recenzentů až při renderování
                try {
                    await renderAllReviews(allReviews, container);
                    console.log('✅ Recenze zobrazeny');
                } catch (renderError) {
                    console.error('❌ Error rendering reviews:', renderError);
                    if (container) {
                        container.innerHTML = `
                            <div class="no-reviews">
                                <i class="fas fa-star"></i>
                                <h4>Zatím nemáte žádné recenze</h4>
                                <p>Jakmile získáte první hodnocení od zákazníků, zobrazí se zde.</p>
                            </div>
                        `;
                    }
                }
                
                // Update rating in statistics after loading reviews
                updateRatingFromReviews(allReviews);

            } catch (error) {
                console.error('❌ Error loading reviews:', error);
                console.error('Error details:', {
                    code: error.code,
                    message: error.message,
                    stack: error.stack
                });
                const container = document.getElementById('allReviewsContainer');
                if (container) {
                    container.innerHTML = `
                        <div class="no-reviews">
                            <i class="fas fa-star"></i>
                            <h4>Zatím nemáte žádné recenze</h4>
                            <p>Jakmile získáte první hodnocení od zákazníků, zobrazí se zde.</p>
                        </div>
                    `;
                }
            }
        }

        // Update rating in statistics from reviews
        function updateRatingFromReviews(reviews) {
            console.log('🔄 Updating rating from reviews:', reviews.length);
            
            if (!reviews || !Array.isArray(reviews)) {
                console.warn('⚠️ Invalid reviews data');
                return;
            }
            
            // Calculate average rating
            const validReviews = reviews.filter(r => r.rating && typeof r.rating === 'number' && r.rating > 0);
            const avgRating = validReviews.length > 0 ? 
                (validReviews.reduce((sum, r) => sum + (r.rating || 0), 0) / validReviews.length) : 0;
            
            const ratingElement = document.querySelector('.stat-card:nth-child(2) .stat-number');
            if (ratingElement) {
                if (validReviews.length > 0) {
                    ratingElement.textContent = avgRating.toFixed(1);
                    console.log('✅ Updated rating from reviews:', avgRating.toFixed(1), 'from', validReviews.length, 'reviews');
                } else {
                    ratingElement.textContent = '-';
                    console.log('📝 No valid reviews found, rating set to "-"');
                }
            } else {
                console.error('❌ Rating element not found!');
            }
        }

        // Render all reviews - asynchronní verze podle profile-detail.js
        async function renderAllReviews(reviews, container) {
            console.log('🎨 Rendering reviews:', reviews?.length || 0, 'reviews');
            if (!container) {
                console.error('❌ Container not provided to renderAllReviews');
                return;
            }
            if (!reviews || reviews.length === 0) {
                console.log('⚠️ No reviews to render, showing empty state');
                container.innerHTML = `
                    <div class="no-reviews">
                        <i class="fas fa-star"></i>
                        <h4>Zatím nemáte žádné recenze</h4>
                        <p>Jakmile získáte první hodnocení od zákazníků, zobrazí se zde.</p>
                    </div>
                `;
                return;
            }
            
            console.log('✅ Rendering', reviews.length, 'reviews');
            
            // Načíst jména recenzentů asynchronně - stejně jako v profile-detail.js
            const { getDoc, doc } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
            const reviewsWithNames = await Promise.all(
                reviews.map(async (review) => {
                    let reviewerName = review.reviewerName || review.reviewerEmail?.split('@')[0] || 'Anonymní';
                    
                    // Pokud máme reviewerId, zkus načíst jméno z profilu
                    if (review.reviewerId && !review.reviewerName) {
                        try {
                            const reviewerProfileRef = doc(window.firebaseDb, 'users', review.reviewerId, 'profile', 'profile');
                            const reviewerProfileSnap = await getDoc(reviewerProfileRef);
                            
                            if (reviewerProfileSnap.exists()) {
                                const reviewerData = reviewerProfileSnap.data();
                                reviewerName = reviewerData.name || 
                                               (reviewerData.firstName && reviewerData.lastName 
                                                ? `${reviewerData.firstName} ${reviewerData.lastName}`.trim()
                                                : reviewerData.email?.split('@')[0] || reviewerName);
                            }
                        } catch (error) {
                            console.warn('⚠️ Nepodařilo se načíst jméno recenzenta:', error);
                        }
                    }
                    
                    return {
                        ...review,
                        reviewerName: reviewerName
                    };
                })
            );

            // Calculate average rating
            const avgRating = (reviewsWithNames.reduce((sum, r) => sum + (r.rating || 0), 0) / reviewsWithNames.length).toFixed(1);
            const totalReviews = reviewsWithNames.length;
            
            // Zobrazit jen 5 nejnovějších recenzí
            const latestReviews = reviewsWithNames.slice(0, 5);

            // Helper function to get time ago
            function getTimeAgo(date) {
                if (!date) return 'Neznámé datum';
                let reviewDate;
                if (date.toDate && typeof date.toDate === 'function') {
                    reviewDate = date.toDate();
                } else if (date instanceof Date) {
                    reviewDate = date;
                } else {
                    reviewDate = new Date(date);
                }
                
                const now = new Date();
                const diffMs = now - reviewDate;
                const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
                
                if (diffDays === 0) return 'Dnes';
                if (diffDays === 1) return 'Včera';
                if (diffDays < 7) return `Před ${diffDays} dny`;
                if (diffDays < 30) return `Před ${Math.floor(diffDays / 7)} týdny`;
                if (diffDays < 365) return `Před ${Math.floor(diffDays / 30)} měsíci`;
                return `Před ${Math.floor(diffDays / 365)} lety`;
            }
            
            // Helper function to create review card
            function createReviewCard(review) {
                const stars = '★'.repeat(review.rating || 0) + '☆'.repeat(5 - (review.rating || 0));
                
                // Zpracovat createdAt nebo updatedAt
                let createdAt;
                if (review.createdAt) {
                    if (typeof review.createdAt.toDate === 'function') {
                        createdAt = review.createdAt.toDate();
                    } else if (review.createdAt instanceof Date) {
                        createdAt = review.createdAt;
                    } else {
                        createdAt = new Date(review.createdAt);
                    }
                } else if (review.updatedAt) {
                    if (typeof review.updatedAt.toDate === 'function') {
                        createdAt = review.updatedAt.toDate();
                    } else if (review.updatedAt instanceof Date) {
                        createdAt = review.updatedAt;
                    } else {
                        createdAt = new Date(review.updatedAt);
                    }
                } else {
                    createdAt = new Date();
                }
                
                const timeAgo = getTimeAgo(createdAt);
                const reviewText = review.text || review.comment || 'Recenze bez komentáře.';
                const reviewerName = review.reviewerName || review.reviewerEmail?.split('@')[0] || 'Anonymní';
                
                return `
                    <div class="review-card">
                        <div class="review-header">
                            <div class="reviewer-info">
                                <div class="reviewer-avatar">
                                    <i class="fas fa-user"></i>
                                </div>
                                <div class="reviewer-details">
                                    <h4>${escapeHtml(reviewerName)}</h4>
                                    <span class="review-date">${timeAgo}</span>
                                </div>
                            </div>
                            <div class="review-rating">
                                <span class="stars">${stars}</span>
                            </div>
                        </div>
                        <div class="review-content">
                            <p>${escapeHtml(reviewText)}</p>
                        </div>
                    </div>
                `;
            }
            
            container.innerHTML = `
                <div class="reviews-summary">
                    <div class="summary-stats">
                        <div class="stat-item">
                            <span class="stat-number">${avgRating}</span>
                            <span class="stat-label">Průměrné hodnocení</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-number">${totalReviews}</span>
                            <span class="stat-label">Celkem recenzí</span>
                        </div>
                    </div>
                </div>
                <div class="reviews-list">
                    ${latestReviews.map(review => createReviewCard(review)).join('')}
                </div>
                ${totalReviews > 5 ? `<div style="text-align: center; margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px;">
                    <p style="margin: 0; color: #666;">Zobrazeno 5 z ${totalReviews} recenzí. <a href="profile-ratings.html" style="color: #f77c00; text-decoration: none; font-weight: 600;">Zobrazit všechny →</a></p>
                </div>` : ''}
            `;
        }

        // Format review date
        function formatReviewDate(date) {
            if (!date) return 'Neznámé datum';
            const reviewDate = date.toDate ? date.toDate() : new Date(date);
            return reviewDate.toLocaleDateString('cs-CZ', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        // Escape HTML
        function escapeHtml(str) {
            return (str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // Tab switching functionality
        function showTab(tabName) {
            console.log('🔄 Switching to tab:', tabName);
            
            // Hide all tab contents
            const allTabs = document.querySelectorAll('.tab-content');
            allTabs.forEach(tab => tab.classList.remove('active'));
            
            // Remove active class from all tab buttons
            const allTabBtns = document.querySelectorAll('.tab-btn');
            allTabBtns.forEach(btn => btn.classList.remove('active'));
            
            // Show selected tab content
            const selectedTab = document.getElementById(tabName + '-tab');
            if (selectedTab) {
                selectedTab.classList.add('active');
            }
            
            // Add active class to relevant tab button (bez závislosti na event)
            const btns = Array.from(document.querySelectorAll('.tab-btn'));
            const currentBtn = btns.find(b => (b.getAttribute('onclick') || '').includes("showTab('" + tabName + "')"));
            if (currentBtn) currentBtn.classList.add('active');
