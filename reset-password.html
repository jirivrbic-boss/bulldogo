<!DOCTYPE html>
<html lang="cs">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z4P6YSMEZH"></script>

      window.dataLayer = window.dataLayer || [];

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Obnovení hesla - BULLDOGO</title>
    <meta name="description" content="Obnovte si heslo k vašemu účtu na BULLDOGO">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://bulldogo.cz/reset-password">
    <meta name="theme-color" content="#ff6a00">
    <link rel="icon" type="image/png" href="fotky/bulldogo-logo.png">
    <link rel="apple-touch-icon" href="fotky/bulldogo-logo.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"></noscript>
    <style>
        .reset-password-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f77c00 0%, #fdf002 100%);
            padding: 2rem;
        }
        
        .reset-password-card {
            background: white;
            border-radius: 16px;
            padding: 2.5rem;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }
        
        .reset-password-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .reset-password-header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f77c00 0%, #fdf002 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }
        
        .reset-password-header p {
            color: #6b7280;
            font-size: 1rem;
        }
        
        .reset-password-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .form-group label {
            font-weight: 600;
            color: #374151;
            font-size: 0.95rem;
        }
        
        .form-group input {
            padding: 0.875rem 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #f77c00;
            box-shadow: 0 0 0 3px rgba(247, 124, 0, 0.1);
        }
        
        .btn-reset {
            background: linear-gradient(135deg, #f77c00 0%, #fdf002 100%);
            color: white;
            border: none;
            padding: 0.875rem 1.5rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(247, 124, 0, 0.4);
        }
        
        .btn-reset:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .success-message {
            background: #d1fae5;
            color: #059669;
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            display: none;
        }
        
        .success-message.show {
            display: block;
        }
        
        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }
        
        .back-link a {
            color: #f77c00;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }
        
        .back-link a:hover {
            color: #e66a00;
        }
        
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .reset-password-card {
                padding: 1.5rem;
            }
            
            .reset-password-header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="reset-password-container">
        <div class="reset-password-card">
            <div class="reset-password-header">
                <h1><i class="fas fa-key"></i> Obnovení hesla</h1>
                <p>Zadejte nové heslo pro váš účet</p>
            </div>
            
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
            
            <form class="reset-password-form" id="resetPasswordForm">
                <div class="form-group">
                    <label for="newPassword">Nové heslo</label>
                    <input 
                        type="password" 
                        id="newPassword" 
                        name="newPassword" 
                        required 
                        minlength="6"
                        placeholder="Zadejte nové heslo (min. 6 znaků)"
                        autocomplete="new-password"
                    >
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">Potvrzení hesla</label>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        name="confirmPassword" 
                        required 
                        minlength="6"
                        placeholder="Zadejte heslo znovu"
                        autocomplete="new-password"
                    >
                </div>
                
                <button type="submit" class="btn-reset" id="submitBtn">
                    <span id="submitText">Nastavit nové heslo</span>
                    <span class="loading" id="loadingSpinner" style="display: none;"></span>
                </button>
            </form>
            
            <div class="back-link">
                <a href="/"><i class="fas fa-arrow-left"></i> Zpět na hlavní stránku</a>
            </div>
        </div>
    </div>

    <script type="module">
        // Získat parametry z URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        // Zkontrolovat, zda je token přítomen
        if (!token) {
            showError('Neplatný nebo chybějící odkaz pro obnovení hesla. Zkuste požádat o nový odkaz.');
            document.getElementById('resetPasswordForm').style.display = 'none';
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 10000);
        }
        
        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.classList.add('show');
        }
        
        function handlePasswordReset() {
            const form = document.getElementById('resetPasswordForm');
            const submitBtn = document.getElementById('submitBtn');
            const submitText = document.getElementById('submitText');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const newPasswordInput = document.getElementById('newPassword');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const newPassword = newPasswordInput.value.trim();
                const confirmPassword = confirmPasswordInput.value.trim();
                
                // Validace
                if (newPassword.length < 6) {
                    showError('Heslo musí mít alespoň 6 znaků.');
                    return;
                }
                
                if (newPassword !== confirmPassword) {
                    showError('Hesla se neshodují. Zkontrolujte prosím zadání.');
                    return;
                }
                
                // Zobrazit loading
                submitBtn.disabled = true;
                submitText.style.display = 'none';
                loadingSpinner.style.display = 'inline-block';
                
                try {
                    console.log('🔄 Nastavuji nové heslo...');
                    
                    // Volat Cloud Function pro reset hesla
                    const functionsUrl = 'https://europe-west1-inzerio-inzerce.cloudfunctions.net/resetPassword';
                    
                    const response = await fetch(functionsUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            token: token,
                            newPassword: newPassword
                        })
                    });
                    
                    const result = await response.json();
                    
                    if (!response.ok) {
                        throw new Error(result.error || result.message || 'Nepodařilo se změnit heslo');
                    }
                    
                    console.log('✅ Heslo úspěšně změněno');
                    
                    // Zobrazit úspěch
                    showSuccess('✅ Heslo bylo úspěšně změněno! Nyní se můžete přihlásit s novým heslem.');
                    
                    // Skrýt formulář
                    form.style.display = 'none';
                    
                    // Přesměrovat na přihlášení po 3 sekundách
                    setTimeout(() => {
                        window.location.href = '/?action=login';
                    }, 3000);
                    
                } catch (error) {
                    console.error('❌ Chyba při změně hesla:', error);
                    
                    let errorMessage = 'Nepodařilo se změnit heslo.';
                    
                    if (error.message && error.message.includes('expired')) {
                        errorMessage = 'Odkaz pro obnovení hesla vypršel. Požádejte prosím o nový odkaz.';
                    } else if (error.message && error.message.includes('Invalid') || error.message.includes('invalid')) {
                        errorMessage = 'Neplatný odkaz pro obnovení hesla. Zkuste požádat o nový odkaz.';
                    } else if (error.message && error.message.includes('weak')) {
                        errorMessage = 'Heslo je příliš slabé. Zvolte silnější heslo.';
                    } else if (error.message && error.message.includes('already been used')) {
                        errorMessage = 'Tento odkaz už byl použit. Požádejte prosím o nový odkaz.';
                    } else {
                        errorMessage = `Chyba: ${error.message || 'Neznámá chyba'}`;
                    }
                    
                    showError(errorMessage);
                    
                    // Obnovit tlačítko
                    submitBtn.disabled = false;
                    submitText.style.display = 'inline';
                    loadingSpinner.style.display = 'none';
                }
            });
        }
        
        // Spustit inicializaci
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', handlePasswordReset);
        } else {
            handlePasswordReset();
        }
    </script>
</body>
</html>
