    <script>
        // Load user ratings from Firebase + refresh při návratu
        document.addEventListener('DOMContentLoaded', () => {
            // Nevolat loadRatingsData hned - počkat na auth state
            loadUserProfile();
            
            // Zkusit načíst recenze i po chvíli, pokud se nenačtou automaticky
            setTimeout(() => {
                const currentUser = window.firebaseAuth?.currentUser;
                if (currentUser) {
                    const ratingCount = document.querySelector('.rating-count');
                    if (ratingCount && ratingCount.textContent === 'Načítání hodnocení...') {
                        console.log('🔄 Zkouším načíst recenze po timeoutu...');
                        loadRatingsData().catch(e => {
                            console.error('❌ Error loading ratings after timeout:', e);
                        });
                    }
                }
            }, 2000);
        });
        window.addEventListener('pageshow', () => {
            // Počkat na auth state před načtením dat
            if (window.firebaseAuth?.currentUser) {
            loadRatingsData();
            loadUserData?.();
            }
        });
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && window.firebaseAuth?.currentUser) {
                loadRatingsData();
            }
        });

        // Load user profile data
        async function loadUserProfile() {
            console.log('🔧🔧🔧 loadUserProfile VOLÁNO (profile-ratings) 🔧🔧🔧');
            try {
                // Wait for Firebase to be available
                let checkCount = 0;
                const checkFirebase = setInterval(() => {
                    checkCount++;
                    console.log('🔍 Checking Firebase (pokus ' + checkCount + '):', {
                        firebaseAuth: !!window.firebaseAuth,
                        firebaseDb: !!window.firebaseDb
                    });
                    if (window.firebaseAuth && window.firebaseDb) {
                        console.log('✅ Firebase available, checking auth');
                        clearInterval(checkFirebase);
                        
                        // Check if user is logged in
                        const currentUser = window.firebaseAuth.currentUser;
                        if (!currentUser) {
                            // User is not logged in - redirect to login
                            console.log('⚠️ Uživatel není přihlášen - přesměrování na přihlášení');
                            if (typeof showAuthModal === 'function') {
                                showAuthModal('login');
                            } else {
                                window.location.href = 'index.html';
                            }
                            return;
                        }
                        
                        // Listen for auth state changes FIRST
                        window.firebaseAuth.onAuthStateChanged((user) => {
                            console.log('👤 Auth state changed on profile-ratings page:', user ? user.email : 'Not logged in');
                            if (user) {
                                console.log('✅ User logged in, loading data...');
                                // Načíst recenze NEZÁVISLE na loadUserData
                                console.log('📚 Načítám recenze nezávisle na loadUserData (auth state changed)...');
                                loadRatingsData().catch(err => {
                                    console.error('❌ Error in loadRatingsData:', err);
                                });
                                
                                // Načíst ostatní data
                                loadUserData().catch(err => {
                                    console.error('❌ Error in loadUserData:', err);
                                });
                            } else {
                                // User logged out - redirect to login
                                console.log('⚠️ Uživatel se odhlásil - přesměrování na přihlášení');
                                if (typeof showAuthModal === 'function') {
                                    showAuthModal('login');
                                } else {
                                    window.location.href = 'index.html';
                                }
                            }
                        });
                        
                        // Pokud je uživatel už přihlášen, načíst data
                        const existingUser = window.firebaseAuth.currentUser;
                        if (existingUser) {
                            console.log('✅ User already logged in, loading data immediately');
                            // Načíst recenze NEZÁVISLE na loadUserData
                            console.log('📚 Načítám recenze nezávisle na loadUserData (existing user)...');
                            loadRatingsData().catch(err => {
                                console.error('❌ Error in loadRatingsData:', err);
                            });
                            
                            // Načíst ostatní data
                            loadUserData().catch(err => {
                                console.error('❌ Error in loadUserData:', err);
                            });
                        }
                    }
                }, 100);
            } catch (error) {
                console.error('❌ Chyba při načítání profilu:', error);
                // Zkusit načíst recenze i při chybě v loadUserProfile
                const currentUser = window.firebaseAuth?.currentUser;
                if (currentUser) {
                    console.log('🔄 Zkouším načíst recenze i při chybě v loadUserProfile...');
                    loadRatingsData().catch(e => {
                        console.error('❌ Error loading ratings after loadUserProfile error:', e);
                    });
                }
            }
        }

        async function loadUserRatings() {
            // Tato funkce je zastaralá - používá se loadRatingsData() přímo
            // Necháme ji pro kompatibilitu, ale nevoláme ji
            console.log('⚠️ loadUserRatings() is deprecated, use loadRatingsData() instead');
        }

        // Načíst a zobrazit recenze pomocí nového modulu
        async function loadRatingsData() {
            console.log('📊 loadRatingsData VOLÁNO');
            try {
                // Počkat na Firebase
                if (!window.firebaseAuth || !window.firebaseDb) {
                    console.log('⏳ Čekám na Firebase...');
                    setTimeout(() => loadRatingsData(), 200);
                    return;
                }
                
                const currentUser = window.firebaseAuth.currentUser;
                if (!currentUser) {
                    console.log('⚠️ Uživatel není přihlášen');
                    return;
                }

                // Počkat na načtení reviews modulu
                if (!window.ReviewsSystem || !window.fetchReviewsForTarget) {
                    console.log('⏳ Waiting for reviews module...');
                    await new Promise(resolve => {
                        const checkInterval = setInterval(() => {
                            if (window.ReviewsSystem && window.fetchReviewsForTarget) {
                                clearInterval(checkInterval);
                                resolve();
                            }
                        }, 100);
                    });
                }

                console.log('✅ Načítám recenze pro uživatele:', currentUser.uid);
                
                // Načíst recenze "o mně"
                const reviews = await window.fetchReviewsForTarget(currentUser.uid, {
                    orderBy: 'createdAt',
                    orderDirection: 'desc'
                });
                
                console.log('✅ Načteno recenzí:', reviews.length);
                
                // Uložit do cache pro řazení
                allReviewsCache = reviews;
                
                // Vypočítat statistiky
                const stats = window.computeRatingsStats(reviews);
                
                // Aktualizovat rating display
                updateRatingsDisplayFromStats(stats);
                
                // Zobrazit graf
                const chartContainer = document.querySelector('.rating-breakdown');
                if (chartContainer) {
                    window.renderRatingsChart(chartContainer, stats);
                }
                
                // Zobrazit recenze
                const reviewsContainer = document.getElementById('reviewsListContainer');
                if (reviewsContainer) {
                    await window.renderReviews(reviewsContainer, reviews, {
                        showAuthorName: true,
                        showPhotos: true
                    });
                }
                
            } catch (error) {
                console.error('❌ Chyba při načítání dat hodnocení:', error);
                const reviewsContainer = document.getElementById('reviewsListContainer');
                if (reviewsContainer) {
                    reviewsContainer.innerHTML = `
                        <div style="text-align: center; padding: 60px 20px; background: white; border-radius: 16px; border: 2px dashed #e5e7eb;">
                            <i class="fas fa-star" style="font-size: 48px; color: #d1d5db; margin-bottom: 16px;"></i>
                            <p style="font-size: 16px; color: #6b7280; margin: 0; font-weight: 500;">Chyba při načítání recenzí: ${error.message}</p>
                        </div>
                    `;
                }
            }
        }
        
        // Aktualizovat rating display ze statistik
        function updateRatingsDisplayFromStats(stats) {
            console.log('📊 Updating ratings display from stats:', stats);
            
            // Celkové hodnocení
            const ratingNumber = document.querySelector('.rating-number');
            if (ratingNumber) {
                ratingNumber.textContent = stats.total > 0 ? stats.average.toFixed(1) : '-';
            }
            
            const ratingCount = document.querySelector('.rating-count');
            if (ratingCount) {
                if (stats.total > 0) {
                    ratingCount.textContent = `Založeno na ${stats.total} ${stats.total === 1 ? 'hodnocení' : stats.total < 5 ? 'hodnoceních' : 'hodnoceních'}`;
                } else {
                    ratingCount.textContent = 'Zatím žádná hodnocení';
                }
            }
            
            // Hvězdičky
            const ratingStars = document.querySelectorAll('.rating-stars .fas.fa-star');
            const filledStars = Math.round(stats.average);
            ratingStars.forEach((star, index) => {
                if (index < filledStars) {
                    star.style.color = '#fbbf24';
                } else {
                    star.style.color = '#d1d5db';
                }
            });
            
            // Breakdown
            updateRatingBreakdownFromStats(stats);
        }
        
        // Aktualizovat breakdown ze statistik
        function updateRatingBreakdownFromStats(stats) {
            [5, 4, 3, 2, 1].forEach(rating => {
                const countEl = document.querySelector(`.rating-bar-${rating} .rating-count`);
                const barEl = document.querySelector(`.rating-bar-${rating} .fill`);
                
                if (countEl) {
                    countEl.textContent = stats.breakdown[rating] || 0;
                }
                
                if (barEl) {
                    barEl.style.width = `${stats.percentages[rating]}%`;
                }
            });
        }

        // Jednoduchá funkce pro načtení a zobrazení všech recenzí (pouze z profilu)
        async function loadAndDisplayAllReviews(userId) {
            console.log('📚 ZAČÍNÁM NAČÍTAT RECENZE PRO UŽIVATELE:', userId);
            
            try {
                const { getDocs, collection } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
                const allReviews = [];
                
                // Načíst recenze na profilu
                try {
                    console.log('📖 Načítám recenze z profilu...');
                    const profileReviewsRef = collection(window.firebaseDb, 'users', userId, 'reviews');
                    const profileSnap = await getDocs(profileReviewsRef);
                    console.log('📖 Nalezeno recenzí na profilu:', profileSnap.size);
                    
                    profileSnap.forEach(doc => {
                        const data = doc.data();
                        console.log('📖 Recenze z profilu:', doc.id, data);
                        allReviews.push({
                            id: doc.id,
                            ...data,
                            type: 'profile'
                        });
                    });
                } catch (error) {
                    console.error('❌ Chyba při načítání recenzí z profilu:', error);
                }
                
                console.log('✅ CELKEM NAČTENO RECENZÍ:', allReviews.length);
                console.log('📊 VŠECHNY RECENZE:', allReviews);
                
                // Zobrazit recenze
                console.log('🎨 VOLÁM DISPLAYALLREVIEWS S', allReviews.length, 'RECENZEMI');
                displayAllReviews(allReviews);
                
                // Aktualizovat statistiky
                updateRatingFromReviews(allReviews);
                
            } catch (error) {
                console.error('❌ CHYBA PŘI NAČÍTÁNÍ RECENZÍ:', error);
                console.error('❌ Error details:', error);
            }
        }

        // Jednoduchá funkce pro zobrazení všech recenzí
        function displayAllReviews(reviews) {
            console.log('🎨 DISPLAYALLREVIEWS VOLÁNO S', reviews?.length || 0, 'RECENZEMI');
            console.log('🎨 Reviews data:', reviews);
            
            const container = document.querySelector('.reviews-list');
            console.log('🎨 Kontejner .reviews-list:', container);
            
            if (!container) {
                console.error('❌❌❌ KONTEJNER .reviews-list NENALEZEN!');
                // Zkusit najít jakýkoli kontejner
                const allContainers = document.querySelectorAll('[class*="review"], [id*="review"]');
                console.log('🎨 Nalezené kontejnery:', allContainers);
                return;
            }
            
            console.log('✅✅✅ KONTEJNER NALEZEN, zobrazuji', reviews.length, 'recenzí');
            
            if (reviews.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 60px 20px; background: white; border-radius: 16px; border: 2px dashed #e5e7eb;">
                        <i class="fas fa-star" style="font-size: 48px; color: #d1d5db; margin-bottom: 16px;"></i>
                        <p style="font-size: 16px; color: #6b7280; margin: 0; font-weight: 500;">Zatím nemáte žádné recenze.</p>
                    </div>
                `;
                return;
            }
            
            // Seřadit podle data (nejnovější první)
            reviews.sort((a, b) => {
                const dateA = a.createdAt?.toDate ? a.createdAt.toDate() : (a.createdAt ? new Date(a.createdAt) : new Date(0));
                const dateB = b.createdAt?.toDate ? b.createdAt.toDate() : (b.createdAt ? new Date(b.createdAt) : new Date(0));
                return dateB - dateA;
            });
            
            // Zobrazit recenze
            container.innerHTML = reviews.map(review => {
                const rating = review.rating || 0;
                const filledStars = '★'.repeat(rating);
                const emptyStars = '☆'.repeat(5 - rating);
                const text = review.text || review.comment || 'Žádný komentář';
                const reviewerName = review.reviewerName || review.reviewerEmail?.split('@')[0] || 'Anonymní';
                
                let dateStr = 'Neznámé datum';
                if (review.createdAt) {
                    if (review.createdAt.toDate) {
                        const date = review.createdAt.toDate();
                        const now = new Date();
                        const diffDays = Math.floor((now - date) / (1000 * 60 * 60 * 24));
                        if (diffDays === 0) dateStr = 'Dnes';
                        else if (diffDays === 1) dateStr = 'Včera';
                        else if (diffDays < 7) dateStr = `Před ${diffDays} dny`;
                        else if (diffDays < 30) dateStr = `Před ${Math.floor(diffDays / 7)} týdny`;
                        else if (diffDays < 365) dateStr = `Před ${Math.floor(diffDays / 30)} měsíci`;
                        else dateStr = `Před ${Math.floor(diffDays / 365)} lety`;
                    }
                }
                
                // Escape HTML
                function escapeHtml(str) {
                    if (!str) return '';
                    const div = document.createElement('div');
                    div.textContent = str;
                    return div.innerHTML;
                }
                
                return `
                    <div class="review-card-modern" style="background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                        <div class="review-card-header" style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px;">
                            <div class="reviewer-info-modern" style="display: flex; align-items: center; gap: 12px;">
                                <div class="reviewer-avatar-modern" style="width: 40px; height: 40px; border-radius: 50%; background: #f3f4f6; display: flex; align-items: center; justify-content: center;">
                                    <i class="fas fa-user" style="color: #6b7280;"></i>
                                </div>
                                <div class="reviewer-details-modern">
                                    <h4 class="reviewer-name" style="margin: 0; font-size: 16px; font-weight: 600; color: #111827;">${escapeHtml(reviewerName)}</h4>
                                    <span class="review-date-modern" style="font-size: 14px; color: #6b7280;">${dateStr}</span>
                                </div>
                            </div>
                            <div class="review-rating-modern">
                                <div class="stars-container" style="font-size: 18px;">
                                    <span class="stars-filled" style="color: #fbbf24;">${filledStars}</span>
                                    <span class="stars-empty" style="color: #d1d5db;">${emptyStars}</span>
                                </div>
                            </div>
                        </div>
                        <div class="review-card-content">
                            <p class="review-text" style="margin: 0; color: #374151; line-height: 1.6;">${escapeHtml(text)}</p>
                        </div>
                    </div>
                `;
            }).join('');
            
            console.log('✅ Recenze zobrazeny');
        }


        function updateRecentReviews(userProfile) {
            const reviewsContainer = document.querySelector('.reviews-list');
            if (!reviewsContainer) return;

            const reviews = userProfile?.recentReviews || [];

            if (reviews.length === 0) {
                reviewsContainer.innerHTML = `
                    <div class="no-reviews">
                                <i class="fas fa-star"></i>
                        <h3>Zatím nemáte žádná hodnocení</h3>
                        <p>Jakmile získáte první hodnocení od zákazníků, zobrazí se zde.</p>
                            </div>
                `;
                return;
            }

            reviewsContainer.innerHTML = reviews.map(review => createReviewCard(review)).join('');
        }

        function createReviewCard(review) {
            console.log('🔍 Creating review card for:', review);
            console.log('🔍 Available fields:', Object.keys(review));
            console.log('🔍 ReviewerId:', review.reviewerId);
            console.log('🔍 ReviewerName:', review.reviewerName);
            
            const stars = Array.from({length: 5}, (_, i) => 
                `<i class="fas fa-star ${i < review.rating ? 'filled' : ''}"></i>`
            ).join('');

            // Get reviewer name from various possible fields
            const reviewerName = review.reviewerName || 
                                review.userName || 
                                review.authorName || 
                                review.fromUserName || 
                                review.name ||
                                'Anonymní';

            // Get review text from various possible fields
            const reviewText = review.comment || 
                              review.text || 
                              review.message || 
                              review.reviewText || 
                              review.description || 
                              'Žádný komentář';

            // Get service title from various possible fields
            const serviceTitle = review.serviceTitle || 
                                review.adTitle || 
                                review.title || 
                                review.serviceName || 
                                'Služba';

            console.log('🔍 Final reviewer name:', reviewerName);

            return `
                <div class="review-item">
                    <div class="review-header">
                        <div class="reviewer-info">
                            <div class="reviewer-avatar">
                                <i class="fas fa-user"></i>
                            </div>
                            <div class="reviewer-details">
                                <div class="reviewer-name">${reviewerName}</div>
                                <div class="review-date">${getTimeAgo(review.updatedAt || review.createdAt)}</div>
                            </div>
                        </div>
                        <div class="review-rating">
                            ${stars}
                        </div>
                    </div>
                    <div class="review-content">
                        <h4 class="review-service">${serviceTitle}</h4>
                        <p class="review-text">${reviewText}</p>
                    </div>
                </div>
            `;
        }

        function getTimeAgo(date) {
            if (!date) return 'Neznámé datum';
            let reviewDate;
            if (date.toDate && typeof date.toDate === 'function') {
                reviewDate = date.toDate();
            } else if (date instanceof Date) {
                reviewDate = date;
            } else {
                reviewDate = new Date(date);
            }
            
            const now = new Date();
            const diffMs = now - reviewDate;
            const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            const diffWeeks = Math.floor(diffDays / 7);

            if (diffWeeks > 0) {
                return `Před ${diffWeeks} týdny`;
            } else if (diffDays > 0) {
                return `Před ${diffDays} dny`;
            } else {
                return 'Dnes';
            }
        }

        // Load actual user data
        async function loadUserData() {
            console.log('💾 Loading user data...');
            try {
                const currentUser = window.firebaseAuth.currentUser;
                if (!currentUser) {
                    console.log('⚠️ Uživatel není přihlášen');
                    return;
                }

                console.log('👤 Načítám data pro uživatele:', currentUser.uid);

                // Load user profile from Firestore
                const { getDoc, doc } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
                const profileRef = doc(window.firebaseDb, 'users', currentUser.uid, 'profile', 'profile');
                const profileSnap = await getDoc(profileRef);
                
                let userProfile = null;
                if (profileSnap.exists()) {
                    userProfile = profileSnap.data();
                }

                // Load user ads to get statistics
                const { getDocs, collection } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
                const adsRef = collection(window.firebaseDb, 'users', currentUser.uid, 'inzeraty');
                const adsSnapshot = await getDocs(adsRef);
                
                const userAds = [];
                adsSnapshot.forEach((doc) => {
                    userAds.push({ id: doc.id, ...doc.data() });
                });

                // Update statistics
                console.log('📊 Calling updateStatistics with:', { userAds: userAds.length, userProfile });
                updateStatistics(userAds, userProfile);
                
                // Recenze se načtou v loadRatingsData()

            } catch (error) {
                console.error('Chyba při načítání dat uživatele:', error);
            }
        }

        // Update statistics with real data
        function updateStatistics(userAds, userProfile) {
            console.log('📊 Updating statistics:', { userAds, userProfile });
            
            // Active ads count
            const activeAds = userAds ? userAds.filter(ad => ad.status === 'active').length : 0;
            const activeAdsElement = document.querySelector('.stat-card:nth-child(1) .stat-number');
            if (activeAdsElement) {
                activeAdsElement.textContent = activeAds > 0 ? activeAds : '-';
                console.log('📝 Updated active ads:', activeAds);
            }

            // Rating will be updated after loading reviews
            const ratingElement = document.querySelector('.stat-card:nth-child(2) .stat-number');
            if (ratingElement) {
                ratingElement.textContent = '-';
            }
            
            console.log('✅ Statistics updated');
        }


        // Řazení recenzí pomocí nového modulu
        let allReviewsCache = [];
        
        async function sortAndDisplayReviews() {
            const sortValue = document.getElementById('sortReviews')?.value || 'newest';
            console.log('🔄 Sorting reviews by:', sortValue);
            
            const currentUser = window.firebaseAuth?.currentUser;
            if (!currentUser) return;
            
            try {
                // Načíst recenze znovu (nebo použít cache)
                if (allReviewsCache.length === 0) {
                    allReviewsCache = await window.fetchReviewsForTarget(currentUser.uid, {
                        orderBy: 'createdAt',
                        orderDirection: 'desc'
                    });
                }
                
                // Seřadit podle výběru
                let sorted = [...allReviewsCache];
                switch(sortValue) {
                    case 'newest':
                        sorted.sort((a, b) => {
                            const dateA = a.createdAt?.toDate?.() || a.createdAt || new Date(0);
                            const dateB = b.createdAt?.toDate?.() || b.createdAt || new Date(0);
                            return new Date(dateB) - new Date(dateA);
                        });
                        break;
                    case 'oldest':
                        sorted.sort((a, b) => {
                            const dateA = a.createdAt?.toDate?.() || a.createdAt || new Date(0);
                            const dateB = b.createdAt?.toDate?.() || b.createdAt || new Date(0);
                            return new Date(dateA) - new Date(dateB);
                        });
                        break;
                    case 'highest':
                        sorted.sort((a, b) => (b.rating || 0) - (a.rating || 0));
                        break;
                    case 'lowest':
                        sorted.sort((a, b) => (a.rating || 0) - (b.rating || 0));
                        break;
                }
                
                // Zobrazit seřazené recenze
                const container = document.getElementById('reviewsListContainer');
                if (container) {
                    await window.renderReviews(container, sorted, {
                        showAuthorName: true,
                        showPhotos: true
                    });
                }
                
            } catch (error) {
                console.error('❌ Error sorting reviews:', error);
            }
        }
        
        // Export pro globální použití
        window.sortAndDisplayReviews = sortAndDisplayReviews;
    </script>
</body>
</html>
