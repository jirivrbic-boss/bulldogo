    <script>
        // Load user ratings from Firebase + refresh při návratu
        document.addEventListener('DOMContentLoaded', () => {
            // Nevolat loadRatingsData hned - počkat na auth state
            loadUserProfile();
        });
        window.addEventListener('pageshow', () => {
            // Počkat na auth state před načtením dat
            if (window.firebaseAuth?.currentUser) {
            loadRatingsData();
            loadUserData?.();
            }
        });
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && window.firebaseAuth?.currentUser) {
                loadRatingsData();
            }
        });

        // Load user profile data
        async function loadUserProfile() {
            console.log('🔧🔧🔧 loadUserProfile VOLÁNO (profile-ratings) 🔧🔧🔧');
            try {
                // Wait for Firebase to be available
                let checkCount = 0;
                const checkFirebase = setInterval(() => {
                    checkCount++;
                    console.log('🔍 Checking Firebase (pokus ' + checkCount + '):', {
                        firebaseAuth: !!window.firebaseAuth,
                        firebaseDb: !!window.firebaseDb
                    });
                    if (window.firebaseAuth && window.firebaseDb) {
                        console.log('✅ Firebase available, checking auth');
                        clearInterval(checkFirebase);
                        
                        // Check if user is logged in
                        const currentUser = window.firebaseAuth.currentUser;
                        if (!currentUser) {
                            // User is not logged in - redirect to login
                            console.log('⚠️ Uživatel není přihlášen - přesměrování na přihlášení');
                            if (typeof showAuthModal === 'function') {
                                showAuthModal('login');
                            } else {
                                window.location.href = 'index.html';
                            }
                            return;
                        }
                        
                        // Listen for auth state changes FIRST
                        window.firebaseAuth.onAuthStateChanged((user) => {
                            console.log('👤 Auth state changed on profile-ratings page:', user ? user.email : 'Not logged in');
                            if (user) {
                                console.log('✅ User logged in, loading data...');
                                loadUserData();
                                loadRatingsData();
                            } else {
                                // User logged out - redirect to login
                                console.log('⚠️ Uživatel se odhlásil - přesměrování na přihlášení');
                                if (typeof showAuthModal === 'function') {
                                    showAuthModal('login');
                                } else {
                                    window.location.href = 'index.html';
                                }
                            }
                        });
                        
                        // Pokud je uživatel už přihlášen, načíst data
                        const existingUser = window.firebaseAuth.currentUser;
                        if (existingUser) {
                            console.log('✅ User already logged in, loading data immediately');
                            loadUserData();
                            loadRatingsData();
                        }
                    }
                }, 100);
            } catch (error) {
                console.error('❌ Chyba při načítání profilu:', error);
            }
        }

        async function loadUserRatings() {
            // Tato funkce je zastaralá - používá se loadRatingsData() přímo
            // Necháme ji pro kompatibilitu, ale nevoláme ji
            console.log('⚠️ loadUserRatings() is deprecated, use loadRatingsData() instead');
        }

        // Global variable for reviews (stejně jako v profile-detail.js)
        let userReviews = [];

        async function loadRatingsData() {
            console.log('🔧🔧🔧 loadRatingsData VOLÁNO 🔧🔧🔧');
            try {
                // Počkat na Firebase
                if (!window.firebaseAuth || !window.firebaseDb) {
                    console.log('⏳ Čekám na Firebase v loadRatingsData...');
                    console.log('⏳ Firebase Auth:', !!window.firebaseAuth);
                    console.log('⏳ Firebase DB:', !!window.firebaseDb);
                    setTimeout(() => loadRatingsData(), 200);
                    return;
                }
                
                const currentUser = window.firebaseAuth.currentUser;
                if (!currentUser) {
                    console.log('⚠️ Uživatel není přihlášen v loadRatingsData');
                    return;
                }

                console.log('✅ Načítám hodnocení pro uživatele:', currentUser.uid);
                console.log('✅ Firebase DB dostupný:', !!window.firebaseDb);

                // Načíst recenze PRVNÍ - před aktualizací display
                console.log('📚📚📚 Začínám načítat recenze...');
                const reviewsCount = await loadUserReviews(currentUser.uid);
                console.log('📚📚📚 loadUserReviews DOKONČENO, vrátil:', reviewsCount);
                console.log('📚 Načteno recenzí:', userReviews.length, '(funkce vrátila:', reviewsCount, ')');
                if (userReviews.length > 0) {
                    console.log('📚 První recenze:', userReviews[0]);
                } else {
                    console.log('⚠️ Žádné recenze nenalezeny');
                }

                // Load user profile to get rating data
                const { getDoc, doc } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
                const profileRef = doc(window.firebaseDb, 'users', currentUser.uid, 'profile', 'profile');
                const profileSnap = await getDoc(profileRef);
                
                let userProfile = null;
                if (profileSnap.exists()) {
                    userProfile = profileSnap.data();
                }

                // Aktualizovat rating display z načtených recenzí (ne z profilu)
                if (userReviews.length > 0) {
                    console.log('📊 Aktualizuji rating z recenzí:', userReviews.length);
                    updateRatingFromReviews(userReviews);
                } else {
                    // Pokud nejsou recenze, použít data z profilu
                    console.log('📊 Používám data z profilu (žádné recenze)');
                    updateRatingsDisplay(userProfile);
                }
                
                // Zobrazit recenze - POČKAT až se rating aktualizuje
                console.log('🎨 Zobrazuji recenze, userReviews.length:', userReviews.length);
                
                // Resetovat sortedReviews, aby se znovu seřadily
                sortedReviews = [];
                currentPage = 1;
                
                // Vždy zobrazit recenze (i když jsou prázdné)
                try {
                    await displayUserReviews();
                    console.log('✅ Recenze zobrazeny (nebo prázdný stav)');
                } catch (displayError) {
                    console.error('❌ Error displaying reviews:', displayError);
                    console.error('Error stack:', displayError.stack);
                    const reviewsContainer = document.getElementById('reviewsListContainer');
                    if (reviewsContainer) {
                        reviewsContainer.innerHTML = `
                            <div style="text-align: center; padding: 60px 20px; background: white; border-radius: 16px; border: 2px dashed #e5e7eb;">
                                <i class="fas fa-star" style="font-size: 48px; color: #d1d5db; margin-bottom: 16px;"></i>
                                <p style="font-size: 16px; color: #6b7280; margin: 0; font-weight: 500;">Chyba při načítání recenzí. Zkuste obnovit stránku.</p>
                            </div>
                        `;
                    }
                }

            } catch (error) {
                console.error('❌ Chyba při načítání dat hodnocení:', error);
                console.error('Error stack:', error.stack);
            }
        }

        // Jednoduchá funkce pro načtení a zobrazení všech recenzí
        async function loadAndDisplayAllReviews(userId) {
            console.log('📚 ZAČÍNÁM NAČÍTAT RECENZE PRO UŽIVATELE:', userId);
            
            try {
                const { getDocs, collection, collectionGroup } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
                const allReviews = [];
                
                // 1. Načíst recenze na profilu
                try {
                    console.log('📖 1. Načítám recenze z profilu...');
                    const profileReviewsRef = collection(window.firebaseDb, 'users', userId, 'reviews');
                    const profileSnap = await getDocs(profileReviewsRef);
                    console.log('📖 1. Nalezeno recenzí na profilu:', profileSnap.size);
                    
                    profileSnap.forEach(doc => {
                        const data = doc.data();
                        console.log('📖 1. Recenze z profilu:', doc.id, data);
                        allReviews.push({
                            id: doc.id,
                            ...data,
                            type: 'profile'
                        });
                    });
                } catch (error) {
                    console.error('❌ Chyba při načítání recenzí z profilu:', error);
                }
                
                // 2. Načíst recenze z inzerátů pomocí collectionGroup
                try {
                    console.log('📖 2. Načítám recenze z inzerátů...');
                    const adReviewsGroup = collectionGroup(window.firebaseDb, 'reviews');
                    const adReviewsSnap = await getDocs(adReviewsGroup);
                    console.log('📖 2. Nalezeno recenzí celkem (collectionGroup):', adReviewsSnap.size);
                    
                    adReviewsSnap.forEach(docSnap => {
                        const reviewData = docSnap.data();
                        const parent = docSnap.ref.parent;
                        const adDoc = parent?.parent;
                        const inzeraty = adDoc?.parent;
                        const userDoc = inzeraty?.parent;
                        
                        if (userDoc && userDoc.id === userId && inzeraty.id === 'inzeraty') {
                            console.log('📖 2. Recenze z inzerátu:', docSnap.id, reviewData);
                            allReviews.push({
                                id: docSnap.id,
                                ...reviewData,
                                type: 'ad',
                                adId: adDoc.id
                            });
                        }
                    });
                    console.log('📖 2. Nalezeno recenzí z inzerátů tohoto uživatele:', allReviews.filter(r => r.type === 'ad').length);
                } catch (error) {
                    console.error('❌ Chyba při načítání recenzí z inzerátů:', error);
                }
                
                console.log('✅ CELKEM NAČTENO RECENZÍ:', allReviews.length);
                console.log('📊 VŠECHNY RECENZE:', allReviews);
                
                // Zobrazit recenze
                console.log('🎨 VOLÁM DISPLAYALLREVIEWS S', allReviews.length, 'RECENZEMI');
                displayAllReviews(allReviews);
                
                // Aktualizovat statistiky
                updateRatingFromReviews(allReviews);
                
            } catch (error) {
                console.error('❌ CHYBA PŘI NAČÍTÁNÍ RECENZÍ:', error);
                console.error('❌ Error details:', error);
            }
        }

        // Jednoduchá funkce pro zobrazení všech recenzí
        function displayAllReviews(reviews) {
            console.log('🎨 DISPLAYALLREVIEWS VOLÁNO S', reviews?.length || 0, 'RECENZEMI');
            console.log('🎨 Reviews data:', reviews);
            
            const container = document.querySelector('.reviews-list');
            console.log('🎨 Kontejner .reviews-list:', container);
            
            if (!container) {
                console.error('❌❌❌ KONTEJNER .reviews-list NENALEZEN!');
                // Zkusit najít jakýkoli kontejner
                const allContainers = document.querySelectorAll('[class*="review"], [id*="review"]');
                console.log('🎨 Nalezené kontejnery:', allContainers);
                return;
            }
            
            console.log('✅✅✅ KONTEJNER NALEZEN, zobrazuji', reviews.length, 'recenzí');
            
            if (reviews.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 60px 20px; background: white; border-radius: 16px; border: 2px dashed #e5e7eb;">
                        <i class="fas fa-star" style="font-size: 48px; color: #d1d5db; margin-bottom: 16px;"></i>
                        <p style="font-size: 16px; color: #6b7280; margin: 0; font-weight: 500;">Zatím nemáte žádné recenze.</p>
                    </div>
                `;
                return;
            }
            
            // Seřadit podle data (nejnovější první)
            reviews.sort((a, b) => {
                const dateA = a.createdAt?.toDate ? a.createdAt.toDate() : (a.createdAt ? new Date(a.createdAt) : new Date(0));
                const dateB = b.createdAt?.toDate ? b.createdAt.toDate() : (b.createdAt ? new Date(b.createdAt) : new Date(0));
                return dateB - dateA;
            });
            
            // Zobrazit recenze
            container.innerHTML = reviews.map(review => {
                const rating = review.rating || 0;
                const filledStars = '★'.repeat(rating);
                const emptyStars = '☆'.repeat(5 - rating);
                const text = review.text || review.comment || 'Žádný komentář';
                const reviewerName = review.reviewerName || review.reviewerEmail?.split('@')[0] || 'Anonymní';
                
                let dateStr = 'Neznámé datum';
                if (review.createdAt) {
                    if (review.createdAt.toDate) {
                        const date = review.createdAt.toDate();
                        const now = new Date();
                        const diffDays = Math.floor((now - date) / (1000 * 60 * 60 * 24));
                        if (diffDays === 0) dateStr = 'Dnes';
                        else if (diffDays === 1) dateStr = 'Včera';
                        else if (diffDays < 7) dateStr = `Před ${diffDays} dny`;
                        else if (diffDays < 30) dateStr = `Před ${Math.floor(diffDays / 7)} týdny`;
                        else if (diffDays < 365) dateStr = `Před ${Math.floor(diffDays / 30)} měsíci`;
                        else dateStr = `Před ${Math.floor(diffDays / 365)} lety`;
                    }
                }
                
                // Escape HTML
                function escapeHtml(str) {
                    if (!str) return '';
                    const div = document.createElement('div');
                    div.textContent = str;
                    return div.innerHTML;
                }
                
                return `
                    <div class="review-card-modern" style="background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                        <div class="review-card-header" style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px;">

        function getTimeAgo(date) {
            if (!date) return 'Neznámé datum';

            } else if (date instanceof Date) {
                reviewDate = date;
            } else {
                reviewDate = new Date(date);
            }
            
            const now = new Date();
            const diffMs = now - reviewDate;
            const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            const diffWeeks = Math.floor(diffDays / 7);

            if (diffWeeks > 0) {
                return `Před ${diffWeeks} týdny`;
            } else if (diffDays > 0) {
                return `Před ${diffDays} dny`;
            } else {
                return 'Dnes';
            }
        }

        // Helper function to get time ago (stejně jako v profile-detail.js)
        function getTimeAgo(date) {
            if (!date) return 'Neznámé datum';
            let reviewDate;
            if (date && date.toDate && typeof date.toDate === 'function') {
                reviewDate = date.toDate();
            } else if (date instanceof Date) {
                reviewDate = date;
            } else {
                reviewDate = new Date(date);
            }
            
            const now = new Date();
            const diff = now - reviewDate;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            
            if (days === 0) return 'Dnes';
            if (days === 1) return 'Včera';
            if (days < 7) return `Před ${days} dny`;
            if (days < 30) return `Před ${Math.floor(days / 7)} týdny`;
            if (days < 365) return `Před ${Math.floor(days / 30)} měsíci`;
            return `Před ${Math.floor(days / 365)} lety`;
        }

        // Sort reviews function
        function sortAndDisplayReviews() {
            const sortValue = document.getElementById('sortReviews')?.value || 'newest';
            console.log('🔄 Sorting reviews by:', sortValue);
            
            sortedReviews = [...userReviews];
            
            switch(sortValue) {
                case 'newest':
                    sortedReviews.sort((a, b) => {
                        const dateA = a.updatedAt?.toDate?.() || a.updatedAt || a.createdAt?.toDate?.() || a.createdAt || new Date(0);
                        const dateB = b.updatedAt?.toDate?.() || b.updatedAt || b.createdAt?.toDate?.() || b.createdAt || new Date(0);
                        return new Date(dateB) - new Date(dateA);
                    });
                    break;
                case 'oldest':
                    sortedReviews.sort((a, b) => {
                        const dateA = a.updatedAt?.toDate?.() || a.updatedAt || a.createdAt?.toDate?.() || a.createdAt || new Date(0);
                        const dateB = b.updatedAt?.toDate?.() || b.updatedAt || b.createdAt?.toDate?.() || b.createdAt || new Date(0);
                        return new Date(dateA) - new Date(dateB);
                    });
                    break;
                case 'highest':
                    sortedReviews.sort((a, b) => (b.rating || 0) - (a.rating || 0));
                    break;
                case 'lowest':
                    sortedReviews.sort((a, b) => (a.rating || 0) - (b.rating || 0));
                    break;
            }
            
            currentPage = 1;
            displayUserReviews();
        }

                // Inicializovat sortedReviews bez volání sortAndDisplayReviews (aby se nevytvořila smyčka)
                const sortValue = document.getElementById('sortReviews')?.value || 'newest';
                sortedReviews = [...userReviews];
                
                switch(sortValue) {
                    case 'newest':
                        sortedReviews.sort((a, b) => {
                            const dateA = a.updatedAt?.toDate?.() || a.updatedAt || a.createdAt?.toDate?.() || a.createdAt || new Date(0);
                            const dateB = b.updatedAt?.toDate?.() || b.updatedAt || b.createdAt?.toDate?.() || b.createdAt || new Date(0);
                            return new Date(dateB) - new Date(dateA);
                        });
                        break;
                    case 'oldest':
                        sortedReviews.sort((a, b) => {
                            const dateA = a.updatedAt?.toDate?.() || a.updatedAt || a.createdAt?.toDate?.() || a.createdAt || new Date(0);
                            const dateB = b.updatedAt?.toDate?.() || b.updatedAt || b.createdAt?.toDate?.() || b.createdAt || new Date(0);
                            return new Date(dateA) - new Date(dateB);
                        });
                        break;
                    case 'highest':
                        sortedReviews.sort((a, b) => (b.rating || 0) - (a.rating || 0));
                        break;
                    case 'lowest':
                        sortedReviews.sort((a, b) => (a.rating || 0) - (b.rating || 0));
                        break;
                }
            }
            
            console.log('📝 displayUserReviews called, sortedReviews.length:', sortedReviews.length, 'userReviews.length:', userReviews.length);
            
            if (sortedReviews.length === 0) {
                reviewsGrid.innerHTML = `
                    <div style="text-align: center; padding: 60px 20px; background: white; border-radius: 16px; border: 2px dashed #e5e7eb;">
                        <i class="fas fa-star" style="font-size: 48px; color: #d1d5db; margin-bottom: 16px;"></i>
                        <p style="font-size: 16px; color: #6b7280; margin: 0; font-weight: 500;">Uživatel zatím nemá žádné recenze.</p>
                    </div>
                `;
                document.getElementById('paginationContainer').style.display = 'none';
                return;
            }
            
            // Paginace
            const totalPages = Math.ceil(sortedReviews.length / reviewsPerPage);
            const startIndex = (currentPage - 1) * reviewsPerPage;
            const endIndex = startIndex + reviewsPerPage;
            const pageReviews = sortedReviews.slice(startIndex, endIndex);
            
            // Načíst jména recenzentů pro aktuální stránku
            let reviewsWithNames = [];
            try {
                const { getDoc, doc } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
                reviewsWithNames = await Promise.all(
                    pageReviews.map(async (review) => {
                        const reviewerId = review.reviewerId || review.fromUserId;
                        const reviewerEmail = review.reviewerEmail || review.fromUserEmail;
                        
                        let reviewerName = review.reviewerName || reviewerEmail?.split('@')[0] || 'Anonymní';
                        
                        if (reviewerId && !review.reviewerName) {
                            try {
                                const reviewerProfileRef = doc(window.firebaseDb, 'users', reviewerId, 'profile', 'profile');
                                const reviewerProfileSnap = await getDoc(reviewerProfileRef);
                                
                                if (reviewerProfileSnap.exists()) {
                                    const reviewerData = reviewerProfileSnap.data();
                                    reviewerName = reviewerData.name || 
                                                   (reviewerData.firstName && reviewerData.lastName 
                                                    ? `${reviewerData.firstName} ${reviewerData.lastName}`.trim()
                                                    : reviewerData.email?.split('@')[0] || reviewerName);
                                }
                            } catch (error) {
                                console.warn('⚠️ Nepodařilo se načíst jméno recenzenta:', error);
                            }
                        }
                        
                        return {
                            ...review,
                            reviewerId: reviewerId,
                            reviewerEmail: reviewerEmail,
                            reviewerName: reviewerName
                        };
                    })
                );
            } catch (error) {
                console.error('❌ Error loading reviewer names:', error);
                // Použít recenze bez jmen
                reviewsWithNames = pageReviews.map(review => ({
                    ...review,
                    reviewerName: review.reviewerName || review.reviewerEmail?.split('@')[0] || 'Anonymní'
                }));
            }
            
            reviewsGrid.innerHTML = reviewsWithNames.map(review => createReviewCard(review)).join('');
            
            // Zobrazit paginaci
            const paginationContainer = document.getElementById('paginationContainer');
            const prevBtn = document.getElementById('prevPageBtn');
            const nextBtn = document.getElementById('nextPageBtn');
            const pageInfo = document.getElementById('pageInfo');
            
            if (totalPages > 1) {
                paginationContainer.style.display = 'block';
                prevBtn.style.display = currentPage > 1 ? 'inline-block' : 'none';
                nextBtn.style.display = currentPage < totalPages ? 'inline-block' : 'none';
                pageInfo.textContent = `Stránka ${currentPage} z ${totalPages} (celkem ${sortedReviews.length} recenzí)`;
            } else {
                paginationContainer.style.display = 'none';
            }
            
            console.log('✅ Reviews displayed:', reviewsWithNames.length, 'on page', currentPage);
        }
        
        // Render all reviews function (stejně jako v profile.html)
        function renderAllReviews(reviews, container) {
            console.log('🎨 renderAllReviews called with', reviews?.length || 0, 'reviews');
            if (!reviews || reviews.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 60px 20px; background: white; border-radius: 16px; border: 2px dashed #e5e7eb;">
                        <i class="fas fa-star" style="font-size: 48px; color: #d1d5db; margin-bottom: 16px;"></i>
                        <p style="font-size: 16px; color: #6b7280; margin: 0; font-weight: 500;">Uživatel zatím nemá žádné recenze.</p>
                    </div>
                `;
                return;
            }

            // Helper function to get time ago
            function getTimeAgoHelper(date) {
                if (!date) return 'Neznámé datum';
                let reviewDate;
                if (date.toDate && typeof date.toDate === 'function') {
                    reviewDate = date.toDate();
                } else if (date instanceof Date) {
                    reviewDate = date;
                } else {
                    reviewDate = new Date(date);
                }
                
                const now = new Date();
                const diffMs = now - reviewDate;
                const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
                
                if (diffDays === 0) return 'Dnes';
                if (diffDays === 1) return 'Včera';
                if (diffDays < 7) return `Před ${diffDays} dny`;
                if (diffDays < 30) return `Před ${Math.floor(diffDays / 7)} týdny`;
                if (diffDays < 365) return `Před ${Math.floor(diffDays / 30)} měsíci`;
                return `Před ${Math.floor(diffDays / 365)} lety`;
            }
            
            // Helper function to escape HTML
            function escapeHtml(str) {
                if (!str) return '';
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }
            
            // Helper function to create review card
            function createReviewCardHelper(review) {
                const rating = review.rating || 0;
                const filledStars = '★'.repeat(rating);
                const emptyStars = '☆'.repeat(5 - rating);
                const text = review.text || review.comment || 'Žádný komentář';
                const reviewerName = review.reviewerName || review.reviewerEmail?.split('@')[0] || 'Anonymní';
                const timeAgo = getTimeAgoHelper(review.createdAt || review.updatedAt);
                
                return `
                    <div class="review-card-modern" style="background: white; border-radius: 12px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                        <div class="review-card-header" style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px;">
                            <div class="reviewer-info-modern" style="display: flex; align-items: center; gap: 12px;">
                                <div class="reviewer-avatar-modern" style="width: 40px; height: 40px; border-radius: 50%; background: #f3f4f6; display: flex; align-items: center; justify-content: center;">
                                    <i class="fas fa-user" style="color: #6b7280;"></i>
                                </div>
                                <div class="reviewer-details-modern">
                                    <h4 class="reviewer-name" style="margin: 0; font-size: 16px; font-weight: 600; color: #111827;">${escapeHtml(reviewerName)}</h4>
                                    <span class="review-date-modern" style="font-size: 14px; color: #6b7280;">${timeAgo}</span>
                                </div>
                            </div>
                            <div class="review-rating-modern">
                                <div class="stars-container" style="font-size: 18px;">
                                    <span class="stars-filled" style="color: #fbbf24;">${filledStars}</span>
                                    <span class="stars-empty" style="color: #d1d5db;">${emptyStars}</span>
                                </div>
                            </div>
                        </div>
                        <div class="review-card-content">
                            <p class="review-text" style="margin: 0; color: #374151; line-height: 1.6;">${escapeHtml(text)}</p>
                        </div>
                    </div>
                `;
            }
            
            // Render reviews
            container.innerHTML = reviews.map(review => createReviewCardHelper(review)).join('');
            console.log('✅ Reviews rendered:', reviews.length);
        }

        // Update recent reviews from loaded data
        function updateRecentReviewsFromData(reviews) {
            console.log('📝 updateRecentReviewsFromData called with:', reviews?.length || 0, 'reviews');
            console.log('📝 userReviews.length:', userReviews?.length || 0);
            
            // VŽDY použít userReviews pokud jsou načtené (mají přednost)
            if (userReviews && userReviews.length > 0) {
                console.log('📝 Using userReviews (preferred):', userReviews.length);
                displayUserReviews().catch(err => {
                    console.error('❌ Error in displayUserReviews:', err);
                });
                return;
            }

            // Fallback: použít předané recenze
            if (!reviews || reviews.length === 0) {
                console.log('📝 No reviews found, showing empty state');
                const reviewsContainer = document.querySelector('.reviews-list');
                if (reviewsContainer) {
                reviewsContainer.innerHTML = `
                        <div style="text-align: center; padding: 60px 20px; background: white; border-radius: 16px; border: 2px dashed #e5e7eb;">
                            <i class="fas fa-star" style="font-size: 48px; color: #d1d5db; margin-bottom: 16px;"></i>
                            <p style="font-size: 16px; color: #6b7280; margin: 0; font-weight: 500;">Uživatel zatím nemá žádné recenze.</p>
                    </div>
                `;
                }
                return;
            }

            // Sort reviews by date (newest first)
            const sortedReviews = [...reviews].sort((a, b) => {
                const dateA = new Date(a.updatedAt?.toDate?.() || a.updatedAt || a.createdAt?.toDate?.() || a.createdAt || 0);
                const dateB = new Date(b.updatedAt?.toDate?.() || b.updatedAt || b.createdAt?.toDate?.() || b.createdAt || 0);
                return dateB - dateA;
            });

            console.log('📝 Rendering', sortedReviews.length, 'reviews using renderAllReviews');
            const reviewsContainer = document.querySelector('.reviews-list');
            if (!reviewsContainer) {
                console.error('❌ Reviews container (.reviews-list) not found!');
                return;
            }
            
            renderAllReviews(sortedReviews, reviewsContainer);
            console.log('✅ Reviews rendered to container');
        }
    </script>
</body>
</html>
